name: Build KernelSU Kernel for RMX3031

on:
  workflow_dispatch:

env:
  KSU_TAG: v0.9.5

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            build-essential device-tree-compiler cpio rsync unzip zip git curl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Verify kernel version
        run: |
          echo "=== Kernel version ==="
          head -5 Makefile

      - name: Get proton-clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../proton-clang

      - name: Patch defconfig for KernelSU requirements
        run: |
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_HAVE_FUNCTION_ERROR_INJECTION=y" >> arch/arm64/configs/oppo6893_defconfig
          echo "CONFIG_FUNCTION_ERROR_INJECTION=y" >> arch/arm64/configs/oppo6893_defconfig

      - name: CRITICAL FIX - Restore as, use system gcc toolchain entirely
        run: |
          echo "=== Restore proton-clang/bin/as if backed up ==="
          if [ -f ../proton-clang/bin/as.proton-original ]; then
            cd ../proton-clang/bin
            rm -f as
            mv as.proton-original as
            echo "Restored original as"
          fi
          echo "=== System cross toolchain ==="
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -1
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head -1
          which aarch64-linux-gnu-ld
          echo "=== Will use aarch64-linux-gnu-gcc as CC (no clang) ==="

      - name: Integrate KernelSU v0.9.5 (non-GKI)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_TAG"

      - name: Generate defconfig
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-w" \
            oppo6893_defconfig 2>&1 | tee defconfig.log

      - name: Verify KSU in final config
        run: |
          grep -E "KPROBES|MODULES|KERNELSU|KSU" .config | head -20

      - name: Build kernel
        run: |
          set -o pipefail
          # 先生成 prepare 和 scripts（生成 trace 头文件）
          echo "=== Running make prepare ==="
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-w" \
            prepare 2>&1 | tail -20
          echo "=== Running make scripts ==="
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-w" \
            scripts 2>&1 | tail -10
          # 检查 trace 头文件是否存在
          echo "=== Check trace headers ==="
          find . -name "*_trace.h" -path "*/trace/*" 2>/dev/null | head -10
          find . -name "core_ctl_trace.h" 2>/dev/null
          find . -name "oppo_foreground_io_opt_trace.h" 2>/dev/null
          # 如果缺失，创建空文件作为 workaround
          for f in include/trace/oppo_foreground_io_opt_trace.h kernel/sched/core_ctl_trace.h; do
            if [ ! -f "$f" ]; then
              echo "Creating empty: $f"
              mkdir -p $(dirname "$f")
              echo "#ifndef _TRACE_PLACEHOLDER" > "$f"
              echo "#define _TRACE_PLACEHOLDER" >> "$f"
              echo "#endif" >> "$f"
            fi
          done
          # 正式编译
          echo "=== Building kernel ==="
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-w" \
            -j$(nproc) 2>&1 | tee build.log
          echo "=== Build artifacts in arch/arm64/boot/ ==="
          ls -lh arch/arm64/boot/ 2>&1 || echo "boot dir not found"

      - name: Collect kernel outputs
        if: success()
        run: |
          mkdir -p out
          echo "=== Looking for kernel image ==="
          ls -lh arch/arm64/boot/ 2>&1
          # 找任何 Image 开头的文件
          KERNEL_IMG=""
          for f in Image.gz-dtb Image.gz Image Image.bz2 Image.lz4; do
            if [ -f "arch/arm64/boot/$f" ]; then
              KERNEL_IMG="$f"
              break
            fi
          done
          if [ -z "$KERNEL_IMG" ]; then
            echo "ERROR: No kernel image found in arch/arm64/boot/"
            find arch/arm64/boot -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "Found kernel image: $KERNEL_IMG"
          cp "arch/arm64/boot/$KERNEL_IMG" "out/Image.gz-dtb"
          # dtbo
          cp arch/arm64/boot/dtbo.img out/ 2>/dev/null || echo "no dtbo.img"
          # dtb files
          find arch/arm64/boot/dts -name "*.dtb" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/

      - name: Clone AnyKernel3 and pack
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cat > anykernel.sh << 'AKEOF'
          kernel.string=RMX3031 KernelSU v0.9.5 (Android 11, 4.14.186)
          do.modules=0
          do.systemless=1
          do.cleanup=1
          block=auto
          is_slot_device=auto
          kernel.filename=Image.gz-dtb
          AKEOF
          cd ..
          cp out/* AnyKernel3/
          cd AnyKernel3
          zip -r9 ../RMX3031-KSU-v0.9.5.zip * -x .git README.md
          cd ..
          ls -lh RMX3031-KSU-v0.9.5.zip

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            defconfig.log
            build.log
            .config

      - name: Upload AnyKernel3 zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RMX3031-KSU-AnyKernel3
          path: RMX3031-KSU-v0.9.5.zip
          retention-days: 30
